user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting: 10MB zone tracks ~160k IPs, allowing 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Host da API (default): /api/v1 e /ws chegam ao backend com o mesmo path.
    server {
        listen 80;
        server_name _ vitrolify-api.lucasfads.com;
        server_tokens off;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana:3000;
        }

        location /grafana/api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_pass http://grafana:3000;
        }
    }

    # Host do site: build estático de frontend/dist (SPA com fallback em index.html).
    server {
        listen 80;
        server_name vitrolify.lucasfads.com;
        server_tokens off;

        root /usr/share/nginx/html/web;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Assets com hash no nome: cache longo (sem add_header aqui, para
        # preservar os security headers herdados do server).
        location /_expo/ {
            expires 1y;
            try_files $uri =404;
        }

        location /assets/ {
            expires 7d;
            try_files $uri =404;
        }

        # index.html e rotas SPA: sempre revalidar para pegar deploys novos.
        location / {
            expires epoch;
            try_files $uri $uri/ /index.html;
        }
    }
}
