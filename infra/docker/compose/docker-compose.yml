services:
  api:
    env_file:
      - ../../../.env
    build:
      context: ../../../api
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-sa.json
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # Delete the volume and command when ready for production
    volumes:
      - ../../../api/app:/api/app
      - ../../../api/alembic.ini:/api/alembic.ini:ro
      - ${FIREBASE_SA_HOST_PATH:-../../../secrets/vitrolify-sa.json}:/run/secrets/firebase-sa.json:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    networks:
      - vitrolify-observability
      - vitrolify-db

  nginx:
    image: nginx:1.29.8-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - grafana
    networks:
      - vitrolify-observability
      - vitrolify-db

  db:
    image: postgres:16-alpine
    env_file:
      - ../../../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - vitrolify-db

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=500MB'
    networks:
      - vitrolify-observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - vitrolify-observability

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../../observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail_data:/var/lib/promtail
    networks:
      - vitrolify-observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - ../../../.env
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - vitrolify-observability
  
  k6:
    image: grafana/k6:0.52.0
    profiles: ["test"]
    depends_on:
      api:
        condition: service_started
    volumes:
      - ../../k6:/scripts:ro
    environment:
      K6_API_BASE_URL: http://nginx
    entrypoint: ["k6"]
    command: ["run", "/scripts/basic_test.js"]
    networks:
      - vitrolify-observability

  # Images used to generate database migrations
  migration-generator:
    build:
      context: ../../../api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../../api:/api
    working_dir: /api
    networks:
      - vitrolify-db
    profiles:
      - utilities 
  migrations:
    build:
      context: ../../../api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://music_room:music_room@db:5432/music_room
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../../api:/api
    working_dir: /api
    command: ["alembic", "upgrade", "head"]
    networks:
      - vitrolify-db

volumes:
  db-data:
  prometheus_data:
  loki_data:
  promtail_data:

networks:
  vitrolify-db:
    internal: true
  vitrolify-observability:
    driver: bridge
